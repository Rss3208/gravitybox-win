name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的版本标签（如 v1.1.3）；仅构建 Windows 草稿，不自动公开'
        required: true
        type: string
      inspect_only:
        description: '只读检查现有发布（从 main 运行，不构建、不上传、不公开）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect-release:
    name: Inspect Existing Release (Read Only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check Existing Release Metadata
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" || echo "Release $RELEASE_TAG not found."

  build-draft-win:
    name: Verify & Prepare Windows Release Artifacts
    if: ${{ github.event_name == 'push' || !inputs.inspect_only }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate Tag Format & Skip If Already Published
        id: precheck
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            Write-Error "需要 vX.Y.Z 正式版本标签，收到：$tag"
            exit 1
          }
          $existingJson = gh release view "$tag" --repo "${{ github.repository }}" --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingJson) {
            $parsed = $existingJson | ConvertFrom-Json
            if (-not $parsed.isDraft) {
              Write-Output "skip=true" >> $env:GITHUB_OUTPUT
              Write-Output "Release $tag is already published; skipping duplicate draft build."
              exit 0
            }
          }
          Write-Output "skip=false" >> $env:GITHUB_OUTPUT

      - name: Checkout Tagged Code
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        if: steps.precheck.outputs.skip != 'true'
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-dotnet@v4
        if: steps.precheck.outputs.skip != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        if: steps.precheck.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Verify Privacy, Docs, Build & Tests
        if: steps.precheck.outputs.skip != 'true'
        env:
          CI: true
          GRAVITYBOX_CI_HEADLESS: '1'
          TZ: UTC
        run: |
          node tools/check-privacy.mjs
          node tools/check-docs.mjs --source-only
          npm run build
          node tools/sync-pricing-feed.mjs
          node tools/run-tests.mjs --win
          dotnet test native-win/GravityBox.sln -c Release
          node tools/verify.mjs --dict-only --no-vendor

      - name: Package Windows Installer & Portable ZIP
        if: steps.precheck.outputs.skip != 'true'
        run: node tools/win/package-win.mjs

      - name: Create or Update Draft Release with Windows Assets
        if: steps.precheck.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $ver = $tag.TrimStart('v')
          $assets = @()
          foreach ($candidate in @(
            "成品/GravityBox-$ver-win-x64-setup.exe",
            "成品/GravityBox-$ver-win-x64-setup.exe.sha256",
            "成品/GravityBox-$ver-win-x64-portable.zip",
            "成品/GravityBox-$ver-win-x64-portable.zip.sha256"
          )) {
            if (Test-Path $candidate) { $assets += $candidate }
          }
          if ($assets.Count -eq 0) {
            Write-Error "No Windows release assets produced."
            exit 1
          }
          $exists = gh release view "$tag" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$tag" @assets --repo "${{ github.repository }}" --clobber
          } else {
            gh release create "$tag" @assets --repo "${{ github.repository }}" --draft --verify-tag --title "GravityBox for Windows $tag" --generate-notes
          }

      - name: Preserve Verification Reports
        if: always() && steps.precheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-win-${{ github.run_id }}
          path: 质检报告/
          if-no-files-found: ignore
          retention-days: 7
